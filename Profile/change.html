
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPashu - Change Password</title>

    <link rel="stylesheet" href="chpass.css">
</head>

<body>

    <main>

        <div class="password-container">

            <!-- Logo -->
            <div class="logo">
                <h1>SmartPashu</h1>
            </div>


            <!-- Heading -->
            <div class="page-heading">

                <h2>Change Password</h2>

                <p>
                    Create a new password to keep your
                    SmartPashu account secure.
                </p>

            </div>


            <!-- Change Password Form -->
            <form action="/change-password" method="POST">

                <!-- Current Password -->
                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        placeholder="Enter current password"
                        required
                    >

                </div>


                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <!-- Password Requirements -->
                <div class="password-info">

                    <h4>Password should contain:</h4>

                    <ul>
                        <li>At least 8 characters</li>
                        <li>One uppercase letter</li>
                        <li>One lowercase letter</li>
                        <li>One number</li>
                    </ul>

                </div>


                <!-- Submit -->
                <button type="submit">
                    Update Password
                </button>

            </form>


            <!-- Back -->
            <div class="back-link">

                <a href="profile.html">
                    ← Back to Profile
                </a>

            </div>

        </div>

    </main>

</body>

</html>
