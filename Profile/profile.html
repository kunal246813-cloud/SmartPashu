
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPashu - Profile</title>
    <link rel="stylesheet" href="pro.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>SmartPashu</h1>

        <nav>
            <a href="/Dashboard/index.html">Dashboard</a>
            <a href="/Profile/profile.html">Profile</a>
        </nav>

    </header>


    <!-- PROFILE -->

    <main>

        <h2>My Profile</h2>

        <p>
            Manage your SmartPashu account information.
        </p>


        <!-- PROFILE PICTURE -->

        <section>

            <h3>Profile Picture</h3>

            <img
                src="profile-placeholder.png"
                alt="Profile Picture"
                width="150"
                height="150"
            >

            <br><br>

            <label for="profilePicture">
                Change Profile Picture
            </label>

            <br>

            <input
                type="file"
                id="profilePicture"
                name="profilePicture"
                accept="image/*"
            >

        </section>


        <br>


        <!-- PERSONAL INFORMATION -->

        <section>

            <h3>Personal Information</h3>

            <form action="/profile/update" method="POST">

                <label for="name">
                    Full Name
                </label>

                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="Your Name"
                    required
                >

                <br><br>

                <button type="submit">
                    Save Name
                </button>

            </form>

        </section>


        <br>


        <!-- EMAIL -->

        <section>

            <h3>Email Address</h3>

            <label for="email">
                Email
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                value="your@email.com"
                readonly
            >

            <br><br>

            <p>
                ✓ Email Verified
            </p>

        </section>


        <br>


        <!-- PHONE -->

        <section>

            <h3>Phone Number</h3>

            <label for="phone">
                Phone Number
            </label>

            <br>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >

            <br><br>

            <button type="button">
                Verify Phone
            </button>

        </section>


        <br>


        <!-- PASSWORD -->

        <section>

            <h3>Security</h3>

            <a href="/Profile/change.html">
                Change Password
            </a>

        </section>s


        <br>


        <!-- LOGOUT -->

        <section>

            <h3>Account</h3>

            <form action="/web login and Register/login.html" method="POST">

                <button type="submit">
                    Logout
                </button>

            </form>

        </section>


        <br>

        <a href="/Dashboard/index.html">
            ← Back to Dashboard
        </a>

    </main>

</body>

</html>
